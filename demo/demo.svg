eyframes r40 { 0%, 52.995% { opacity: 0; } 52.997%, 100% { opacity: 1; } }@keyframes m40 { 0%, 52.995% { transform: translateX(0); animation-timing-function: steps(14, end); } 53.961%, 100% { transform: translateX(120.0px); } }@keyframes r41 { 0%, 54.650% { opacity: 0; } 54.652%, 100% { opacity: 1; } }@keyframes r42 { 0%, 57.803% { opacity: 0; } 57.805%, 100% { opacity: 1; } }@keyframes r43 { 0%, 57.803% { opacity: 0; } 57.805%, 100% { opacity: 1; } }@keyframes r44 { 0%, 57.803% { opacity: 0; } 57.805%, 100% { opacity: 1; } }@keyframes r45 { 0%, 61.350% { opacity: 0; } 61.352%, 100% { opacity: 1; } }@keyframes r46 { 0%, 63.714% { opacity: 0; } 63.716%, 100% { opacity: 1; } }@keyframes m46 { 0%, 63.714% { transform: translateX(0); animation-timing-function: steps(30, end); } 65.783%, 100% { transform: translateX(254.9px); } }@keyframes r47 { 0%, 66.473% { opacity: 0; } 66.475%, 100% { opacity: 1; } }@keyframes r48 { 0%, 66.473% { opacity: 0; } 66.475%, 100% { opacity: 1; } }@keyframes r49 { 0%, 66.473% { opacity: 0; } 66.475%, 100% { opacity: 1; } }@keyframes r50 { 0%, 66.473% { opacity: 0; } 66.475%, 100% { opacity: 1; } }@keyframes r51 { 0%, 69.626% { opacity: 0; } 69.628%, 100% { opacity: 1; } }@keyframes m51 { 0%, 69.626% { transform: translateX(0); animation-timing-function: steps(16, end); } 70.729%, 100% { transform: translateX(136.9px); } }@keyframes r52 { 0%, 71.419% { opacity: 0; } 71.421%, 100% { opacity: 1; } }@keyframes r53 { 0%, 74.571% { opacity: 0; } 74.573%, 100% { opacity: 1; } }@keyframes r54 { 0%, 74.571% { opacity: 0; } 74.573%, 100% { opacity: 1; } }@keyframes r55 { 0%, 74.571% { opacity: 0; } 74.573%, 100% { opacity: 1; } }@keyframes r56 { 0%, 78.118% { opacity: 0; } 78.120%, 100% { opacity: 1; } }@keyframes r57 { 0%, 80.483% { opacity: 0; } 80.485%, 100% { opacity: 1; } }@keyframes r58 { 0%, 81.665% { opacity: 0; } 81.667%, 100% { opacity: 1; } }@keyframes m58 { 0%, 81.665% { transform: translateX(0); animation-timing-function: steps(33, end); } 83.941%, 100% { transform: translateX(280.2px); } }@keyframes r59 { 0%, 84.631% { opacity: 0; } 84.633%, 100% { opacity: 1; } }@keyframes r60 { 0%, 87.783% { opacity: 0; } 87.785%, 100% { opacity: 1; } }@keyframes scroll { 0% { transform: translateY(0); } 32.650% { transform: translateY(-20px); } 32.650% { transform: translateY(-40px); } 32.650% { transform: translateY(-60px); } 32.650% { transform: translateY(-80px); } 32.650% { transform: translateY(-100px); } 32.650% { transform: translateY(-120px); } 35.803% { transform: translateY(-140px); } 37.941% { transform: translateY(-160px); } 41.094% { transform: translateY(-180px); } 41.094% { transform: translateY(-200px); } 41.094% { transform: translateY(-220px); } 44.640% { transform: translateY(-240px); } 46.296% { transform: translateY(-260px); } 49.448% { transform: translateY(-280px); } 49.448% { transform: translateY(-300px); } 49.448% { transform: translateY(-320px); } 52.995% { transform: translateY(-340px); } 54.650% { transform: translateY(-360px); } 57.803% { transform: translateY(-380px); } 57.803% { transform: translateY(-400px); } 57.803% { transform: translateY(-420px); } 61.350% { transform: translateY(-440px); } 63.714% { transform: translateY(-460px); } 66.473% { transform: translateY(-480px); } 66.473% { transform: translateY(-500px); } 66.473% { transform: translateY(-520px); } 66.473% { transform: translateY(-540px); } 69.626% { transform: translateY(-560px); } 71.419% { transform: translateY(-580px); } 74.571% { transform: translateY(-600px); } 74.571% { transform: translateY(-620px); } 74.571% { transform: translateY(-640px); } 78.118% { transform: translateY(-660px); } 80.483% { transform: translateY(-680px); } 81.665% { transform: translateY(-700px); } 84.631% { transform: translateY(-720px); } 87.783% { transform: translateY(-740px); } }.scroll { animation-timing-function: step-end; }</style>
  <defs><clipPath id="view"><rect x="0" y="34" width="668" height="516"/></clipPath></defs>
  <rect width="668" height="550" rx="10" fill="#1e1e2e"/>
  <path d="M0 10 a10 10 0 0 1 10 -10 h648 a10 10 0 0 1 10 10 v24 h-668 z" fill="#181825"/>
  <circle cx="18" cy="17.0" r="6" fill="#f38ba8"/><circle cx="38" cy="17.0" r="6" fill="#f9e2af"/><circle cx="58" cy="17.0" r="6" fill="#a6e3a1"/>
  <text x="334.0" y="9.0" text-anchor="middle" class="dim" style="font-size: 12px">clipstack — demo</text>
  <g clip-path="url(#view)">
    <g transform="translate(0 34)">
      <g class="a scroll" style="animation-name: scroll">
        <text x="18" y="18" class="a" style="animation-name: r0"><tspan class="bold">ClipStack — clipboard history with multi-clip paste</tspan></text><text x="18" y="38" class="a" style="animation-name: r1"></text><text x="18" y="58" class="a" style="animation-name: r2"><tspan class="dim"># Everything you copy is recorded in the background.</tspan></text><text x="18" y="78" class="a" style="animation-name: r3"><tspan class="fg">  </tspan><tspan class="yellow">⌘C</tspan><tspan class="fg">  Jane Ferrer</tspan></text><text x="18" y="98" class="a" style="animation-name: r4"><tspan class="fg">  </tspan><tspan class="yellow">⌘C</tspan><tspan class="fg">  jane@acme.io</tspan></text><text x="18" y="118" class="a" style="animation-name: r5"><tspan class="fg">  </tspan><tspan class="yellow">⌘C</tspan><tspan class="fg">  +44 7700 900112</tspan></text><text x="18" y="138" class="a" style="animation-name: r6"><tspan class="fg">  </tspan><tspan class="yellow">⌘C</tspan><tspan class="fg">  Invoice #1042 — Acme Ltd, due 30 Sep</tspan></text><text x="18" y="158" class="a" style="animation-name: r7"><tspan class="fg">  </tspan><tspan class="yellow">⌘C</tspan><tspan class="fg">  https://acme.io/orders/1042</tspan></text><text x="18" y="178" class="a" style="animation-name: r8"><tspan class="green">$ </tspan><tspan class="fg">clipstack list --pretty</tspan></text><rect x="34.9" y="176" width="195.9" height="20" fill="#1e1e2e" class="a" style="animation-name: m8"/><text x="18" y="198" class="a" style="animation-name: r9"><tspan class="fg">  0  https://acme.io/orders/1042 — Code</tspan></text><text x="18" y="218" class="a" style="animation-name: r10"><tspan class="fg">  1  Invoice #1042 — Acme Ltd, due 30 Sep — Code</tspan></text><text x="18" y="238" class="a" style="animation-name: r11"><tspan class="fg">  2  +44 7700 900112 — Code</tspan></text><text x="18" y="258" class="a" style="animation-name: r12"><tspan class="fg">  3  jane@acme.io — Code</tspan></text><text x="18" y="278" class="a" style="animation-name: r13"><tspan class="fg">  4  Jane Ferrer — Code</tspan></text><text x="18" y="298" class="a" style="animation-name: r14"><tspan class="dim"># Merge: pick several clips, paste them once.</tspan></text><text x="18" y="318" class="a" style="animation-name: r15"><tspan class="green">$ </tspan><tspan class="fg">clipstack merge 4 3 2</tspan></text><rect x="34.9" y="316" width="179.0" height="20" fill="#1e1e2e" class="a" style="animation-name: m15"/><text x="18" y="338" class="a" style="animation-name: r16"><tspan class="fg">copied 3 clips</tspan></text><text x="18" y="358" class="a" style="animation-name: r17"><tspan class="cyan">┌ clipboard</tspan></text><text x="18" y="378" class="a" style="animation-name: r18"><tspan class="cyan">│ </tspan><tspan class="fg">Jane Ferrer</tspan></text><text x="18" y="398" class="a" style="animation-name: r19"><tspan class="cyan">│ </tspan><tspan class="fg">jane@acme.io</tspan></text><text x="18" y="418" class="a" style="animation-name: r20"><tspan class="cyan">│ </tspan><tspan class="fg">+44 7700 900112</tspan></text><text x="18" y="438" class="a" style="animation-name: r21"><tspan class="cyan">└</tspan></text><text x="18" y="458" class="a" style="animation-name: r22"><tspan class="dim"># Queue: paste them into different fields, one after another.</tspan></text><text x="18" y="478" class="a" style="animation-name: r23"><tspan class="green">$ </tspan><tspan class="fg">clipstack list --pretty -n 6</tspan></text><rect x="34.9" y="476" width="238.0" height="20" fill="#1e1e2e" class="a" style="animation-name: m23"/><text x="18" y="498" class="a" style="animation-name: r24"><tspan class="fg">  0  Jane Ferrer ⏎ jane@acme.io ⏎ +44 7700 900112 — Code</tspan></text><text x="18" y="518" class="a" style="animation-name: r25"><tspan class="fg">  1  https://acme.io/orders/1042 — Code</tspan></text><text x="18" y="538" class="a" style="animation-name: r26"><tspan class="fg">  2  Invoice #1042 — Acme Ltd, due 30 Sep — Code</tspan></text><text x="18" y="558" class="a" style="animation-name: r27"><tspan class="fg">  3  +44 7700 900112 — Code</tspan></text><text x="18" y="578" class="a" style="animation-name: r28"><tspan class="fg">  4  jane@acme.io — Code</tspan></text><text x="18" y="598" class="a" style="animation-name: r29"><tspan class="fg">  5  Jane Ferrer — Code</tspan></text><text x="18" y="618" class="a" style="animation-name: r30"><tspan class="green">$ </tspan><tspan class="fg">clipstack queue 5 4 3</tspan></text><rect x="34.9" y="616" width="179.0" height="20" fill="#1e1e2e" class="a" style="animation-name: m30"/><text x="18" y="638" class="a" style="animation-name: r31"><tspan class="fg">1/3</tspan></text><text x="18" y="658" class="a" style="animation-name: r32"><tspan class="cyan">┌ clipboard</tspan></text><text x="18" y="678" class="a" style="animation-name: r33"><tspan class="cyan">│ </tspan><tspan class="fg">Jane Ferrer</tspan></text><text x="18" y="698" class="a" style="animation-name: r34"><tspan class="cyan">└</tspan></text><text x="18" y="718" class="a" style="animation-name: r35"><tspan class="green">$ </tspan><tspan class="fg">clipstack next</tspan></text><rect x="34.9" y="716" width="120.0" height="20" fill="#1e1e2e" class="a" style="animation-name: m35"/><text x="18" y="738" class="a" style="animation-name: r36"><tspan class="fg">2/3</tspan></text><text x="18" y="758" class="a" style="animation-name: r37"><tspan class="cyan">┌ clipboard</tspan></text><text x="18" y="778" class="a" style="animation-name: r38"><tspan class="cyan">│ </tspan><tspan class="fg">jane@acme.io</tspan></text><text x="18" y="798" class="a" style="animation-name: r39"><tspan class="cyan">└</tspan></text><text x="18" y="818" class="a" style="animation-name: r40"><tspan class="green">$ </tspan><tspan class="fg">clipstack next</tspan></text><rect x="34.9" y="816" width="120.0" height="20" fill="#1e1e2e" class="a" style="animation-name: m40"/><text x="18" y="838" class="a" style="animation-name: r41"><tspan class="fg">3/3</tspan></text><text x="18" y="858" class="a" style="animation-name: r42"><tspan class="cyan">┌ clipboard</tspan></text><text x="18" y="878" class="a" style="animation-name: r43"><tspan class="cyan">│ </tspan><tspan class="fg">+44 7700 900112</tspan></text><text x="18" y="898" class="a" style="animation-name: r44"><tspan class="cyan">└</tspan></text><text x="18" y="918" class="a" style="animation-name: r45"><tspan class="dim"># Search, then copy by the number it shows.</tspan></text><text x="18" y="938" class="a" style="animation-name: r46"><tspan class="green">$ </tspan><tspan class="fg">clipstack search acme --pretty</tspan></text><rect x="34.9" y="936" width="254.9" height="20" fill="#1e1e2e" class="a" style="animation-name: m46"/><text x="18" y="958" class="a" style="animation-name: r47"><tspan class="fg">  1  jane@acme.io — Code</tspan></text><text x="18" y="978" class="a" style="animation-name: r48"><tspan class="fg">  3  Jane Ferrer ⏎ jane@acme.io ⏎ +44 7700 900112 — Code</tspan></text><text x="18" y="998" class="a" style="animation-name: r49"><tspan class="fg">  4  https://acme.io/orders/1042 — Code</tspan></text><text x="18" y="1018" class="a" style="animation-name: r50"><tspan class="fg">  5  Invoice #1042 — Acme Ltd, due 30 Sep — Code</tspan></text><text x="18" y="1038" class="a" style="animation-name: r51"><tspan class="green">$ </tspan><tspan class="fg">clipstack copy 5</tspan></text><rect x="34.9" y="1036" width="136.9" height="20" fill="#1e1e2e" class="a" style="animation-name: m51"/><text x="18" y="1058" class="a" style="animation-name: r52"><tspan class="fg">copied #5</tspan></text><text x="18" y="1078" class="a" style="animation-name: r53"><tspan class="cyan">┌ clipboard</tspan></text><text x="18" y="1098" class="a" style="animation-name: r54"><tspan class="cyan">│ </tspan><tspan class="fg">Invoice #1042 — Acme Ltd, due 30 Sep</tspan></text><text x="18" y="1118" class="a" style="animation-name: r55"><tspan class="cyan">└</tspan></text><text x="18" y="1138" class="a" style="animation-name: r56"><tspan class="dim"># Password managers mark secrets as concealed; those are never recorded.</tspan></text><text x="18" y="1158" class="a" style="animation-name: r57"><tspan class="fg">  </tspan><tspan class="yellow">⌘C</tspan><tspan class="fg">  ••••••••  (from a password manager)</tspan></text><text x="18" y="1178" class="a" style="animation-name: r58"><tspan class="green">$ </tspan><tspan class="fg">clipstack search hunter2 --pretty</tspan></text><rect x="34.9" y="1176" width="280.2" height="20" fill="#1e1e2e" class="a" style="animation-name: m58"/><text x="18" y="1198" class="a" style="animation-name: r59"><tspan class="fg">(no matches)</tspan></text><text x="18" y="1218" class="a" style="animation-name: r60"><tspan class="dim"># clipstack pick does all of this from a dialog — tick as many as you like.</tspan></text>
      </g>
    </g>
  </g>
</svg>
